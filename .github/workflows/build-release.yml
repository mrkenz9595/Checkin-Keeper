name: Build & Release Checkin Keeper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Chọn loại build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'release'
          - 'debug'
      version_tag:
        description: 'Phiên bản gắn thẻ (ví dụ: v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Tạo GitHub Release và tải lên file APK'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (${{ github.event.inputs.build_type || 'Release & Debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper Permissions
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Decode Keystore (Optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Build Debug APK
      - name: Build Debug APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      # Build Release APK with R8
      - name: Build Release APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Organize Artifacts
        id: prepare_artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p dist

          # Copy Release APK if built
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/CheckinKeeper-${VERSION}-release.apk
            echo "Copied release APK to dist/CheckinKeeper-${VERSION}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/CheckinKeeper-${VERSION}-release-unsigned.apk
            echo "Copied unsigned release APK to dist/CheckinKeeper-${VERSION}-release-unsigned.apk"
          fi

          # Copy Debug APK if built
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/CheckinKeeper-${VERSION}-debug.apk
            echo "Copied debug APK to dist/CheckinKeeper-${VERSION}-debug.apk"
          fi

          # Copy ProGuard / R8 mapping file if generated
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping-${VERSION}.txt
            echo "Copied R8 mapping file"
          fi

          echo "Available files in dist/:"
          ls -lh dist/

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CheckinKeeper-${{ env.VERSION }}
          path: dist/*
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        with:
          tag_name: ${{ env.VERSION }}
          name: Checkin Keeper ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
